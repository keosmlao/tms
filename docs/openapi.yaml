openapi: 3.1.0
info:
  title: ODG TMS Mobile API
  version: "1.0.0"
  summary: API consumed by the ODG TMS Flutter driver app + the public bill-tracking page.
  description: |
    All `/api/mobile/*` endpoints require a JWT Bearer token issued by `POST /api/mobile/login`.
    The token expires after 8 hours; clients should re-authenticate before expiry.

    Public tracking is unauthenticated but rate-limited.

servers:
  - url: https://your-deployment.example.com
    description: Production
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: auth
  - name: jobs
  - name: bills
  - name: fuel
  - name: notifications
  - name: public

security:
  - bearerAuth: []

paths:
  /api/mobile/login:
    post:
      tags: [auth]
      summary: Driver login — exchange username/password for a JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/mobile/refresh:
    post:
      tags: [auth]
      summary: Re-mint a fresh 8h JWT for a still-valid token.
      description: |
        The driver app calls this proactively during long trips (and at launch)
        so continuous GPS tracking survives past the 8h token lifetime without a
        re-login. A fully-expired token returns 401 — the app then falls back to
        a normal login.
      responses:
        '200':
          description: A fresh token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/mobile/jobs:
    get:
      tags: [jobs]
      summary: List mobile jobs.
      description: |
        Default scope returns the authenticated driver's jobs. Supervisor-capable
        tokens may pass `scope=all` to return all drivers' jobs, optionally
        filtered by driver/status/date.
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: scope
          schema: { type: string, enum: [all] }
        - in: query
          name: driver_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, active, done, issue] }
      responses:
        '200':
          description: Jobs list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeliveryJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [jobs]
      summary: Perform a job action (state transition, image attach, fuel refill, etc.).
      description: |
        Workflow actions (`receive`, `pickup_bill`, `start_dispatch`, `checkin_bill`,
        `complete_bill`, `complete_job`) auto-progress `job_status` so the driver
        doesn't have to call them in strict order. Tapping `complete_bill` on a
        fresh trip (job_status=0) will silently set job_status=2 and backfill
        `dispatch_started_at`. The only hard preconditions are:

          - `approve_status = 1` (trip approved by dispatcher)
          - `job_status >= 1` for `pickup_bill` / `receive_customer_bill` — the
            driver must call `receive` (ຮັບຖ້ຽວ) first. These two used to
            auto-receive; taking the trip is now an explicit step, so goods
            never leave a warehouse against a trip nobody has accepted.
          - `recipt_job IS NOT NULL` for checkin/complete on warehouse-pickup
            bills — driver must have picked up the goods first
          - `job_status < 3` — once the trip is closed, no edits are accepted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobAction' }
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/mobile/bills:
    get:
      tags: [bills]
      summary: Fetch bills for a doc_no, a single bill_no, or product items for a bill.
      parameters:
        - in: query
          name: doc_no
          schema: { type: string }
        - in: query
          name: bill_no
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [products] }
          description: When 'products', returns the line-items of the bill_no.
      responses:
        '200':
          description: Bills or items
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/mobile/fuel:
    get:
      tags: [fuel]
      summary: List the driver's fuel-refill history.
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: limit
          schema: { type: string, pattern: '^\d+$' }
      responses:
        '200':
          description: Fuel log summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { type: object }
                  totalLiters: { type: number }
                  totalAmount: { type: number }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/mobile/settings:
    get:
      tags: [settings]
      summary: Driver-app feature flags. Allow-list controlled server-side.
      responses:
        '200':
          description: Feature flag map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_scan_verify_enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/mobile/fcm-token:
    post:
      tags: [notifications]
      summary: Register/update the device's Firebase Cloud Messaging token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 4096 }
                platform: { type: string }
      responses:
        '200': { description: Token saved }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [notifications]
      summary: Remove a device's FCM token (logout, uninstall).
      parameters:
        - in: query
          name: token
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        '200': { description: Token removed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/mobile/location:
    post:
      tags: [jobs]
      summary: Ingest a buffered batch of the driver's device GPS points for one trip.
      description: |
        The driver app samples its device GPS roughly every 3 seconds and POSTs
        the accumulated points as a batch (one DB write per request instead of
        ~20/min/driver). Each point carries its own `recorded_at` capture time so
        points buffered while offline keep their real order; omit it and the
        server stamps the insert time. The driver must own `doc_no` in the active
        (fixed-year) window. Rate-limited to 120 requests/min per driver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_no, points]
              properties:
                doc_no: { type: string, minLength: 1, maxLength: 64 }
                imei:
                  type: string
                  description: Device identifier (same key as the hardware GPS log). May be absent on newer Android.
                  example: "359292060123456"
                device:
                  type: object
                  description: Static-ish device identity, upserted into odg_tms_mobile_device by IMEI. All fields optional.
                  properties:
                    model: { type: string, example: "Samsung SM-A155" }
                    os_version: { type: string, example: "Android 14" }
                    app_version: { type: string, example: "1.2.3" }
                    carrier: { type: string, example: "LTC" }
                    sim_phone: { type: string, example: "2055512345" }
                points:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [lat, lng]
                    properties:
                      lat: { type: string, example: "17.975615" }
                      lng: { type: string, example: "102.556761" }
                      recorded_at:
                        type: string
                        description: On-device capture time (ISO-8601). Defaults to insert time if omitted.
                        example: "2026-06-01 15:46:08"
                      speed: { type: string, description: Ground speed (m/s or km/h, app's choice). }
                      heading: { type: string, description: Bearing in degrees 0–360. }
                      accuracy: { type: string, description: Horizontal accuracy in meters. }
                      battery: { type: string, description: Battery percent 0–100. }
                      signal: { type: string, description: Network signal (dBm or bars, app's choice). }
      responses:
        '200':
          description: Points saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  saved: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Trip does not belong to the driver }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/public/track:
    get:
      tags: [public]
      summary: Public bill tracking — no auth, IP-rate-limited.
      security: []
      parameters:
        - in: query
          name: bill_no
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Bill snapshot or null
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                  - type: 'null'
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/health:
    get:
      tags: [public]
      summary: Liveness/health probe with DB connectivity check.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '503':
          description: One or more dependencies are unhealthy

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing/invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed to access this scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Body or query failed Zod validation; `issues` echoes the field errors.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  issues:
                    type: array
                    items: { type: object }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: string }
        X-RateLimit-Limit:
          schema: { type: string }
        X-RateLimit-Remaining:
          schema: { type: string }
        X-RateLimit-Reset:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256 }

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT, valid for 8 hours.
        code: { type: string }
        username: { type: string }
        name_1: { type: string }
        driver_id: { type: string }
        logistic_code: { type: string }
        title: { type: string }

    DeliveryJob:
      type: object
      properties:
        doc_date: { type: string }
        doc_no: { type: string }
        car: { type: string }
        driver: { type: string }
        item_bill: { type: integer }
        approve_status: { type: integer }
        job_status: { type: integer }
        waiting_bill_count: { type: integer }
        inprogress_bill_count: { type: integer }
        completed_bill_count: { type: integer }
        cancelled_bill_count: { type: integer }
        miles_start: { type: string }
        miles_end: { type: string }

    JobAction:
      oneOf:
        - $ref: '#/components/schemas/ReceiveAction'
        - $ref: '#/components/schemas/PickupBillAction'
        - $ref: '#/components/schemas/StartDispatchAction'
        - $ref: '#/components/schemas/CheckinBillAction'
        - $ref: '#/components/schemas/CompleteBillAction'
        - $ref: '#/components/schemas/CancelBillAction'
        - $ref: '#/components/schemas/RevertCompleteBillAction'
        - $ref: '#/components/schemas/EditCompleteBillAction'
        - $ref: '#/components/schemas/CompleteJobAction'
        - $ref: '#/components/schemas/SaveTravelHistoryAction'
        - $ref: '#/components/schemas/TrackingStatusAction'
        - $ref: '#/components/schemas/AttachJobImageAction'
        - $ref: '#/components/schemas/AttachBillImageAction'
        - $ref: '#/components/schemas/FuelRefillAction'
      discriminator:
        propertyName: action

    ReceiveAction:
      type: object
      required: [action, doc_no]
      properties:
        action: { const: receive }
        doc_no: { type: string }
    PickupBillAction:
      type: object
      required: [action, bill_no]
      description: |
        Driver picks the bill's goods up at the warehouse. `items` is optional:
        send it to report the quantity ACTUALLY handed over per item. Any line
        below the planned quantity rewrites `odg_tms_detail_item.selected_qty`
        for this trip (so the shortfall returns to the pending pool), logs a row
        in `odg_tms_pickup_variance`, and notifies the dispatcher. A line above
        the planned quantity is logged but NOT applied. Omit `items` for the
        plain / bulk pickup tap, which takes the full planned quantity.
        Rejected with 400 when every item is reported as zero — use
        `cancel_bill` instead.
      properties:
        action: { const: pickup_bill }
        bill_no: { type: string }
        comment: { type: string, description: Driver note stored on each variance row }
        items:
          type: array
          description: Actual received quantity per item (optional)
          items:
            type: object
            required: [item_code, qty]
            properties:
              item_code: { type: string }
              qty: { type: number, minimum: 0 }
    StartDispatchAction:
      type: object
      required: [action, doc_no, miles_start]
      properties:
        action: { const: start_dispatch }
        doc_no: { type: string }
        miles_start: { type: string }
        lat: { type: string }
        lng: { type: string }
    CheckinBillAction:
      type: object
      required: [action, bill_no]
      properties:
        action: { const: checkin_bill }
        bill_no: { type: string }
        lat: { type: string }
        lng: { type: string }
    CompleteBillAction:
      type: object
      required: [action, bill_no]
      properties:
        action: { const: complete_bill }
        bill_no: { type: string }
        items:
          type: array
          items: { type: object }
        comment: { type: string }
        lat: { type: string }
        lng: { type: string }
        lat_end: { type: string }
        lng_end: { type: string }
    CancelBillAction:
      type: object
      required: [action, bill_no]
      properties:
        action: { const: cancel_bill }
        bill_no: { type: string }
        comment: { type: string }
        lat: { type: string }
        lng: { type: string }
        lat_end: { type: string }
        lng_end: { type: string }
    RevertCompleteBillAction:
      type: object
      required: [action, bill_no]
      properties:
        action: { const: revert_complete_bill }
        bill_no: { type: string }
    EditCompleteBillAction:
      type: object
      required: [action, bill_no]
      properties:
        action: { const: edit_complete_bill }
        bill_no: { type: string }
        items:
          type: array
          items: { type: object }
        comment: { type: string }
    CompleteJobAction:
      type: object
      required: [action, doc_no, miles_end]
      properties:
        action: { const: complete_job }
        doc_no: { type: string }
        miles_end: { type: string }
        lat: { type: string }
        lng: { type: string }
    SaveTravelHistoryAction:
      type: object
      required: [action, doc_no, lat, lng]
      properties:
        action: { const: save_travel_history }
        doc_no: { type: string }
        lat: { type: string }
        lng: { type: string }
    TrackingStatusAction:
      type: object
      required: [action, doc_no, status]
      properties:
        action: { const: tracking_status }
        doc_no: { type: string }
        status:
          type: string
          enum: [gps_off, no_permission, auth_expired]
          description: 'Why the driver app cannot post GPS for this active trip.'
    AttachJobImageAction:
      type: object
      required: [action, doc_no, kind]
      properties:
        action: { const: attach_job_image }
        doc_no: { type: string }
        kind: { type: string, enum: [start, end] }
        image_data:
          type: string
          description: 'data:image/* URI, max 8MB.'
    AttachBillImageAction:
      type: object
      required: [action, bill_no, kind]
      properties:
        action: { const: attach_bill_image }
        bill_no: { type: string }
        kind: { type: string, enum: [primary, delivery, signature] }
        image_data: { type: string }
        replace:
          type: boolean
          description: 'When true on a `delivery` upload, wipe existing delivery images for this bill first. Used in edit flow.'
    FuelRefillAction:
      type: object
      required: [action, user_code, liters, amount]
      properties:
        action: { const: fuel_refill }
        user_code: { type: string }
        driver_name: { type: string }
        car: { type: string }
        doc_no: { type: string }
        liters: { type: number, minimum: 0, maximum: 10000 }
        amount: { type: number, minimum: 0, maximum: 100000000 }
        odometer: { type: number }
        station: { type: string }
        note: { type: string }
        image_data: { type: string }
        lat: { type: string }
        lng: { type: string }
